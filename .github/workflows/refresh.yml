# Rebuilds the site from fresh Wikidata, Wikipedia (DBpedia), MusicBrainz and dblp data once a
# month and publishes it to GitHub Pages: the same `fetch`, `build`, `site` and `deploy` steps as
# by hand, plus the browser-vs-Python tests and a check that the new data isn't much smaller than
# what is live. If any step fails, the live site is left as it was (and GitHub emails you). Run it
# by hand from the Actions tab: "Monthly data refresh" -> "Run workflow". It takes about an hour.
name: Monthly data refresh

on:
  schedule:
    - cron: "17 4 3 * *"   # 04:17 UTC on the 3rd of every month
  workflow_dispatch:
    inputs:
      allow_smaller:
        description: "Publish even if the new data is more than 5% smaller than the live site"
        type: boolean
        default: false

permissions:
  contents: write   # push the new site to the gh-pages branch
  actions: write    # keep this schedule switched on (last step)

concurrency:
  group: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v7

      - name: Make room on disk
        # the build needs about 18 GB at its peak; these preinstalled toolchains free ~25 GB
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h .

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install numpy

      - name: Download from Wikidata, DBpedia, MusicBrainz and dblp
        # resumable: a retry only re-runs the queries and downloads that failed
        run: |
          for attempt in 1 2 3; do
            python3 sixdeg.py fetch && exit 0
            echo "some queries failed (attempt $attempt); trying again in 5 minutes"
            sleep 300
          done
          exit 1

      - name: Build the database
        # Only links between people on Wikidata: also adding everyone else in MusicBrainz and dblp
        # (about 5 million more people) would take the site past GitHub Pages' 1 GB limit.
        run: python3 sixdeg.py build --wikidata-people-only

      - name: Export the website
        run: python3 sixdeg.py site

      - name: Check the website against the Python app
        run: |
          python3 tests/static_reference.py refs.json
          python3 tests/static_reference.py --app app.json
          node tests/test_static.mjs site refs.json app.json

      - name: Check the new data isn't much smaller than the live site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api -H "Accept: application/vnd.github.raw" \
               "repos/$GITHUB_REPOSITORY/contents/data/meta.json?ref=gh-pages" > live-meta.json; then
            # that's only fine when nothing has been published yet
            if gh api "repos/$GITHUB_REPOSITORY/branches/gh-pages" --silent; then exit 1; fi
          fi
          python3 tests/check_refresh.py live-meta.json site/data/meta.json ${{ inputs.allow_smaller && '--allow-drop 1' || '' }}

      - name: Publish to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python3 sixdeg.py deploy "$GITHUB_REPOSITORY" -m "Data refresh $(date -u +%Y-%m-%d)" \
            --author "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Keep the monthly schedule switched on
        # GitHub switches off scheduled workflows in repositories with no activity for 60 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/refresh.yml/enable"
