<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Six Degrees</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='17' font-weight='700' text-anchor='middle' fill='white'%3E6%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=202611031323-eb7ca669">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">6°</span>
      <div>
        <h1>Six Degrees</h1>
        <p id="stats" class="stats">Loading database…</p>
        <p id="net" class="net" hidden></p>
      </div>
    </div>
  </header>

  <main>
    <section class="panel" aria-label="Find a connection">
      <div class="pickers">
        <div class="picker" id="pick-from">
          <label for="in-from">From</label>
          <div class="field">
            <span class="field-avatar" aria-hidden="true"></span>
            <input id="in-from" type="search" autocomplete="off" spellcheck="false" placeholder="Search anyone — e.g. Kevin Bacon"
                   role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sug-from">
          </div>
          <p class="chosen-meta"></p>
          <ul class="suggest" id="sug-from" role="listbox" hidden></ul>
        </div>
        <button id="swap" class="swap" type="button" title="Swap" aria-label="Swap the two people">⇄</button>
        <div class="picker" id="pick-to">
          <label for="in-to">To</label>
          <div class="field">
            <span class="field-avatar" aria-hidden="true"></span>
            <input id="in-to" type="search" autocomplete="off" spellcheck="false" placeholder="…and anyone else — e.g. Ada Lovelace"
                   role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sug-to">
          </div>
          <p class="chosen-meta"></p>
          <ul class="suggest" id="sug-to" role="listbox" hidden></ul>
        </div>
      </div>

      <fieldset class="cats">
        <legend>Count these kinds of links</legend>
        <div id="cats" class="chips"></div>
      </fieldset>

      <div class="actions">
        <button id="go" class="primary" type="button" disabled>Find connection</button>
        <button id="random" class="ghost" type="button">Surprise me</button>
        <div id="avoiding" class="avoiding" hidden></div>
      </div>
    </section>

    <section id="result" class="result" aria-live="polite"></section>
  </main>

  <aside id="drawer" class="drawer" aria-label="Person details" hidden>
    <div class="drawer-inner" id="drawer-body"></div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <footer class="foot">
    Data: <a href="https://www.wikidata.org" target="_blank" rel="noopener">Wikidata</a> (CC0),
    Wikipedia infoboxes via <a href="https://www.dbpedia.org" target="_blank" rel="noopener">DBpedia</a> (CC BY-SA),
    <a href="https://musicbrainz.org" target="_blank" rel="noopener">MusicBrainz</a> (CC0) and
    <a href="https://dblp.org" target="_blank" rel="noopener">dblp</a> (CC0); photos via Wikimedia Commons.
    Links are what these sources record — absence of a link isn't evidence two people never met.
  </footer>
  <script>window.SIXDEG_STATIC = { data: "data/", version: "202611031323", web: "202611031323-eb7ca669" };</script>
  <script src="engine.js?v=202611031323-eb7ca669"></script>
  <script src="app.js?v=202611031323-eb7ca669"></script>
</body>
</html>
